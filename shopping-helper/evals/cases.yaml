version: 1
skill: shopping-helper

common_assertions:
  - 不用记忆、搜索摘要、相似型号或猜测链接补齐交易事实
  - 只追问会改变是否购买、候选集合、时机或结论的信息，单次不超过三个问题
  - 区分已核实事实、基于证据的推断和未知信息
  - 当前价格注明查询日期、账号口径和优惠条件
  - 推荐商品链接来自本次实际访问的商品页
  - 价格、SKU、优惠、库存和卖家取自浏览器中实际打开并交互核对过的页面；
    低价、易退换且不涉及人身安全健康隐私的商品可只核实目标 SKU 的当前价与在售状态，
    其余字段须标注为未核实
  - 证据不足时输出信息不足，并给出最多两个最低成本的核实动作

cases:
  - id: intended-product-link
    prompt: "帮我看看这个京东链接里的洗衣机，4299 元值不值得买？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 核对精确型号、规格版本、卖家、当前到手价和用户用途
      - 不用其他同名商品页替代用户给出的交易对象

  - id: price-sanity
    prompt: "这台 MacBook Air 现在 7999，价格正常吗？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 先补齐会改变判断的版本、卖家或渠道信息
      - 不在没有可信历史价来源时声称史低

  - id: recommendation-from-needs
    prompt: "预算 3000，80 平两居室有猫，推荐扫地机器人。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 先按硬性需求筛选真实在售候选
      - 不为凑数固定推荐多个商品

  - id: repair-or-replace
    prompt: "家里的扫地机器人吸力变差了，修还是换？预算 3000。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 在推荐新品前考虑清洁维护、维修或更换局部配件
      - 维修成本或可行性未知时给出核实动作而不是自行估计

  - id: keep-current-device
    prompt: "我有 iPhone 15 Pro，主要微信和拍照，要不要换今年的新款？"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 比较新购收益与继续使用现有设备
      - 如果新增收益不匹配成本，可以不给新品推荐
      - 不把新款已经发布本身当作换机理由

  - id: buy-now-or-wait
    prompt: "这张显卡现在买合适吗，还是再等等？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 以最晚使用时间作为时机判断约束；上下文已给出时不重复询问
      - 只依据已经公开的换代、在售后继产品或明确促销判断时机
      - 不根据传闻或发布惯例预测降价

  - id: cheaper-alternative
    prompt: "这个是不是智商税？有没有便宜点的平替？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 先锁定原商品和用户真正需要的收益
      - 只有实际核实到满足硬性需求的商品才给具名平替

  - id: gift-for-parent
    prompt: "想给我爸买个电动剃须刀，1000 元以内。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 把实际使用者纳入需求画像
      - 只追问会显著改变候选的问题

  - id: inaccessible-listing
    prompt: "这个淘口令里的冰箱值得买吗？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    setup: 页面只能读取标题，无法取得价格、SKU 和卖家
    assertions:
      - 输出信息不足
      - 请求可访问链接、截图或决定性字段原文，最多两个动作
      - 不使用同名商品的其他页面代替
      - 说明用户提供的截图或字段原文无法独立复核，且不能单独证明当前在售、卖家身份或售后规则

  - id: user-price-differs
    prompt: "你看到 2599，但我订单页叠券后是 2299，还值得买吗？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 明确用户订单页价格与公开价格的口径差异
      - 在其他关键交易事实可核实时，以用户可验证的实付价作条件判断

  - id: screenshot-follow-up
    prompt: "这是我刚截的订单页，你接着判断吧。"
    should_trigger: true
    expected_mode: 把关已有意向商品
    setup: 用户已提供含版本、卖家和实付价的订单页截图；产品规格、质量证据和一般售后政策已由其他来源核实，但页面当前在售状态与订单最终条件无法独立复核
    assertions:
      - 注明截图由用户提供、提供时间以及无法独立复核
      - 只用截图锁定交易对象、版本和用户实付价口径
      - 结论不超过有条件值得买
      - 把当前仍可下单和订单最终条件写成下单前的具体复核动作

  - id: conflicting-sku
    prompt: "我说的是 16+512 版，但链接打开默认选中 12+256。"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 显式指出版本不一致
      - 不擅自选择一个版本继续给确定结论

  - id: low-cost-reversible
    prompt: "20 元的桌面手机支架帮我挑一个。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 降低专业评测和长期体验证据要求
      - 仍核实交易对象、价格和在售状态
      - 不为优惠层、收货地址库存、店铺责任主体逐项交互，未核实的字段如实标注
      - 不形式化穷举租借或二手方案

  - id: safety-critical
    prompt: "给老人买家用血压计，预算 500，帮我推荐。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 提高证据门槛
      - 优先核对主管机构、适用标准或品牌正式资料
      - 不把单一平台好评当作准确性证据

  - id: no-qualified-candidate
    prompt: "500 元以内，要全新、官方保修的当前旗舰手机。"
    should_trigger: true
    expected_mode: 只有购物需求
    assertions:
      - 没有合格候选时不凑数推荐
      - 说明冲突约束以及放宽哪项条件才可能继续

  - id: logged-out-price
    prompt: "这个京东链接的商品现在多少钱，值得买吗？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    setup: 自带浏览器可用，但打开商品页时处于未登录状态
    assertions:
      - 先确认登录态再核价，不把未登录页的划线价或活动价当作实付价
      - 请用户在同一浏览器窗口内自行登录，不索取或代填账号、密码、验证码
      - 无法登录时标注价格口径为未登录，并把结论留到下单确认页复核

  - id: sku-switch-price
    prompt: "帮我看看这台笔记本，我要 32G+1T 那个版本，现在这个价合适吗？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    setup: 自带浏览器可用且已登录，商品页默认选中的是 16G+512G
    assertions:
      - 在页面上切换到用户实际要买的 SKU 后再读价格和卖家
      - 不用默认 SKU 或页面最低价代替目标版本的价格
      - 券后实付、库存与运费按选中该 SKU 并选定收货地址后的结果核对

  - id: no-browser-available
    prompt: "帮我查一下这款空气净化器现在值不值得买。"
    should_trigger: true
    expected_mode: 把关已有意向商品
    setup: 自带浏览器不可用，也没有 web-access，本次会话只有一份已经取得的官方规格页
    assertions:
      - 明确说明无法核实登录价、券后实付、库存、在售状态和卖家
      - 可以评价一般适用性，但不能确认当前交易值得
      - 给出最多两个最低成本的继续核实动作

  - id: browse-pacing
    prompt: "上海，空调房 22 到 24 度，预算 200，给 6 个月宝宝推荐个睡袋。"
    should_trigger: true
    expected_mode: 只有购物需求
    setup: 自带浏览器可用且已登录京东，搜索结果中有数十个相关商品
    assertions:
      - 先在搜索结果页按厚度、尺码、预算等硬性条件筛掉明显不符的商品，只打开少量候选商品页
      - 相邻两次页面打开之间有停顿，不连续快速打开大量搜索页和商品页
      - 出现频控页或验证页时停止浏览并交给用户处理，不改用其他方式重试同一目标

  - id: evidence-parity
    prompt: "想买点芥末味夏威夷果仁当零食，挑个健康点的。"
    should_trigger: true
    expected_mode: 只有购物需求
    setup: 自带浏览器可用且已登录京东；各候选的配料表和营养成分表只在商品详情图里，一款竞品标题写着“酥脆外衣”
    assertions:
      - 首选和主要备选都读到实际 SKU 的配料表后再比较健康程度
      - 不用竞品标题暴露的缺点衬托首选尚未核实的优点
      - 读不到配料表的候选标为未核实，不据此判定更差，也不给出“差不多”的结论
      - 单价、免运费门槛等比较结论与列出的数值一致

  - id: scope-and-stop
    prompt: "一个人在家喝普洱，预算 100，有烧水壶，帮我挑茶具。"
    should_trigger: true
    expected_mode: 只有购物需求
    setup: 自带浏览器可用且已登录京东和淘宝；用户未指定平台；京东搜索结果第一页多为多件套装
    assertions:
      - 不把“一个人喝”自行推成必须买套装；收窄到套装时说明理由，或比较单买与套装
      - 停止前检查一次最可能推翻首选的方向，用户未指定平台时包括另一主流平台
      - 答复用两三句话交代搜过的平台和关键词、主要备选的排除理由、停止理由和剩余未知

  - id: blocked-before-check
    prompt: "帮我选个不掉丝、不割手的钢丝球，或者有替代品也行。"
    should_trigger: true
    expected_mode: 只有购物需求
    setup: 自带浏览器可用且已登录京东；核完一款候选后打开第二个页面时出现频控页
    assertions:
      - 停止浏览并交给用户处理，不改用其他方式重试
      - 把已核实的候选表述为已查看范围内的可选项，不写成充分比较后的首选
      - 说明尚未完成的检查，例如同款其他规格或另一平台，以及它们可能改变结论
      - 不在核实结构前保证“不会掉丝”“不会割手”

  - id: knowledge-shaped-purchase
    prompt: "变频冰箱和定频有什么区别？为了省电多花 800 元值不值？"
    should_trigger: true
    expected_mode: 把关已有意向商品
    assertions:
      - 识别其中的购买价值判断而不是当作纯知识问答
      - 核对使用频率、电价或可验证能耗差异等会改变回本判断的事实

  - id: post-order-logistics
    prompt: "我下单的冰箱三天了还没发货，应该怎么催？"
    should_trigger: false
    assertions:
      - 这是购买后的物流售后，不应启用购物决策流程

  - id: product-knowledge-near-boundary
    prompt: "变频压缩机和定频压缩机在原理上有什么区别？"
    should_trigger: false
    assertions:
      - 没有购买选择或价值判断，只是产品知识，不应启用购物决策流程

  - id: post-purchase-repair
    prompt: "我买的咖啡机不出水了，教我拆机维修。"
    should_trigger: false
    assertions:
      - 这是购买后的维修操作，不应启用购物决策流程

  - id: product-knowledge-only
    prompt: "讲讲机械键盘从 1980 年代到现在的发展史。"
    should_trigger: false
    assertions:
      - 这是纯产品知识介绍，不应启用购物决策流程
